networks:
    mathmpr:
        name: mathmpr

services:
    mathmpr:
        build:
            context: ./
            dockerfile: Dockerfile
            args:
                user: mathmpr
                uid: 1000
        image: mathmpr
        container_name: mathmpr-app
        restart: unless-stopped
        tty: true
        working_dir: /var/www/
        ports:
            - "3002:3002"
            - "3003:3003"
        environment:
            BROWSERSYNC_PROXY: http://nginx
            BROWSERSYNC_HOST: 0.0.0.0
            BROWSERSYNC_PORT: 3002
            BROWSERSYNC_UI_PORT: 3003
        volumes:
            - ./:/var/www
            - ./docker-compose/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
        depends_on:
            db:
                condition: service_healthy
        networks:
            - mathmpr

    db:
        image: mysql:8.0
        container_name: mathmpr_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: mathmpr
            MYSQL_ROOT_PASSWORD: root
            MYSQL_PASSWORD: root
            MYSQL_USER: mathmpr
            SERVICE_TAGS: dev
            SERVICE_NAME: mysql
        volumes:
            - ./docker-compose/mysql:/docker-entrypoint-initdb.d
            - ./docker-compose/mysql/data:/var/lib/mysql
        ports:
            - "3308:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 5s
            retries: 20
        networks:
            - mathmpr

    nginx:
        image: nginx:1.17-alpine
        container_name: mathmpr-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www
            - ./docker-compose/nginx:/etc/nginx/conf.d
            - ./storage:/var/www/storage
            - ./storage/app/public:/var/www/html/public/storage
        depends_on:
            - mathmpr
        networks:
            - mathmpr
